# The public tree's checks: what a contributor runs locally, run on every push
# to main and on every pull request. The suite here is the unit tests that need
# nothing but the source; the differential tests against the legacy build skip
# without a checkout of it (see the README).

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: tests, types and both bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Each test file runs in its own worker with Node's default heap, which
      # the runner sizes at about 2 GB; the panel test outgrows it and the
      # worker dies ("Worker exited unexpectedly"), so the suite gets the
      # same margin the private repository's workflow gives it.
      - run: npm test
        env:
          NODE_OPTIONS: --max-old-space-size=3072
      - run: npm run typecheck
      - run: npm run build
